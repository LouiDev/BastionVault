name: CI

on:
  push:
    # main is not listed on purpose: every push to main is a release or hotfix and carries a
    # v* tag in the same push, so the tag run already builds and tests that exact commit.
    # Pull requests against main (hotfixes) still get the required status check below.
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (windows, .NET 10)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BastionVault.slnx

      - name: Build (warnings are errors)
        run: dotnet build BastionVault.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test BastionVault.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  publish:
    name: Publish release binaries
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # WPF does not support trimming or NativeAOT; both variants are untrimmed.
      - name: Publish framework-dependent
        run: >
          dotnet publish src/BastionVault.App/BastionVault.App.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -o publish/framework-dependent

      - name: Publish self-contained
        run: >
          dotnet publish src/BastionVault.App/BastionVault.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true
          -o publish/self-contained

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Copy-Item LICENSE, NOTICE, THIRD-PARTY-NOTICES.md, README.md publish/framework-dependent
          Copy-Item LICENSE, NOTICE, THIRD-PARTY-NOTICES.md, README.md publish/self-contained
          Compress-Archive -Path publish/framework-dependent/* -DestinationPath "BastionVault-$v-win-x64.zip"
          Compress-Archive -Path publish/self-contained/* -DestinationPath "BastionVault-$v-win-x64-selfcontained.zip"
          Get-FileHash BastionVault-*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            BastionVault-*.zip
            SHA256SUMS.txt
          body: |
            Unsigned binaries: Windows SmartScreen will warn on first start. Verify the
            SHA-256 sums in SHA256SUMS.txt. See CHANGELOG.md for what changed.
